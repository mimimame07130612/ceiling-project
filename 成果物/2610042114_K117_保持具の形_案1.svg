<text x="40.0" y="937.0" fill="#222" text-anchor="start" font-size="12">形（案1）の要点：</text>
<text x="40.0" y="959.0" fill="#222" text-anchor="start" font-size="12">・下：底板（A03-001、P0側から0.7D）。前（LP側への滑り）・上：前面上角の爪（P3側）。左右：側板。</text>
<text x="40.0" y="981.0" fill="#222" text-anchor="start" font-size="12">・左右のC・C′の高さは同じ（h=245.885、収納）、dは左52・右70（Δd=18）。右はC′保持具の内板（x=161.7〜162.7）がそのまま右側板（K098の積み重ね）</text>
<text x="40.0" y="1003.0" fill="#222" text-anchor="start" font-size="12">・左は左リンクの面（x=95.55）とCSP左端（104.6）の間が離れているため、側板からコの字までのつなぎ板（x方向 6.50）が要る。OAの面（x=96.8〜99.3）を横切る（当たらないかは未確認）</text>
<text x="40.0" y="1025.0" fill="#222" text-anchor="start" font-size="12">・後ろ（SC側）への外れ：背面より後ろに出せない（A03-001。収納時 P0 d=47.77 と前壁側の限界 47.5 の差は0.27）ため、形で止める手段が未決（D04-004が未達）</text>
<text x="40.0" y="1047.0" fill="#222" text-anchor="start" font-size="12">・質量の目安（アルミ、厚さは仮）：底板 57.1×(0.7D)×厚0.3 0.69kg、側板 2枚（概略 22×18×0.3） 0.64kg、爪 57.1×4×0.3 0.19kg、左のつなぎ板・コの字（厚1.0、概略） 0.30kg、右のコの字の外板（厚1.0） 0.10kg　合計 約1.92kg（ねじ・ブッシュ別）。予算 約3.8kg（K116）</text>
<text x="40.0" y="1069.0" fill="#222" text-anchor="start" font-size="12">・未検討：グリルの有無（爪の形）、保持具の安全率（A04-007 の保持具の値は未見直し）、底板と側板・爪のつなぎ方、CSPの出し入れの手順</text>
