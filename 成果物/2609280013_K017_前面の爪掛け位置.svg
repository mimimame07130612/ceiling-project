<text x="1180" y="543.1" fill="#444" text-anchor="start" font-size="13">(爪の厚さは模式、2 で図示)</text>
<text x="60" y="560" fill="#222" text-anchor="start" font-size="14" font-weight="bold">■ 爪の厚さが収納時の高さ条件（K015式①、すき間0.77）に効く量（計算、余裕寸法0）</text>
<text x="70" y="584" fill="#D35400" text-anchor="start" font-size="13">爪（下角）：底面の下の厚さ a、前面の前の厚さ b</text>
<text x="70" y="604" fill="#D35400" text-anchor="start" font-size="13">　最下点がP1から下がる量 ＝ 0.914·a + 0.407·b　→　0.914·a + 0.407·b ≦ 0.77</text>
<text x="70" y="624" fill="#D35400" text-anchor="start" font-size="13">　例：a=b=1 で 1.32（すき間を超える）。K016の底面部分支持の板と同じく、最下点に直接効く</text>
<text x="70" y="644" fill="#2E9E6B" text-anchor="start" font-size="13">爪（上角）：上面の上の厚さ a′、前面の前の厚さ b′</text>
<text x="70" y="664" fill="#2E9E6B" text-anchor="start" font-size="13">　上角P3の高さは最上点P2より 8.70 低い → a′·0.914 − b′·0.407 ≦ 8.70 までは最上点が上がらない</text>
<text x="70" y="684" fill="#2E9E6B" text-anchor="start" font-size="13">　奥行（K015式②、余裕10.74）には b′·0.914 + a′·0.407 が効く</text>
<text x="70" y="704" fill="#444" text-anchor="start" font-size="13">どちらも前面の空き（左右両端）の範囲に置く前提。ポート開口の近くに物を置いたときの音への影響は資料なし</text>
