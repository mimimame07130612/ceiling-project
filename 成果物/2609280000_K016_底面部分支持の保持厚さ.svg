<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="640" viewBox="0 0 1480 640" font-family="Noto Sans CJK JP, Hiragino Sans, Meiryo, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="40" fill="#222" text-anchor="start" font-size="18" font-weight="bold">K016　底面部分支持の保持厚さ（STEP2 2-5）</text>
<text x="40" y="62" fill="#222" text-anchor="start" font-size="12">作成 2609280000　側面図（左がSC側、右がLP側）。CSP単体・チルト24°・収納時（A02-003）。座標はCSP基準（P0原点）。単位cm</text>
<text x="40" y="82" fill="#2E9E6B" text-anchor="start" font-size="12">例示：支持率 r=0.7（P0から底面の70%）、t下=3.70（すき間0.77も使い切った上限）</text>
<polygon points="242,370 476.6,474.4 559.6,288.1 325,183.6" fill="#f2f2f2" fill-opacity="1" stroke="#333333" stroke-width="1.4"/>
<polyline points="476.6,474.4 559.6,288.1" fill="none" fill-opacity="1" stroke="#C0392B" stroke-width="4"/>
<polygon points="242,370 406.2,443.1 388.2,483.6 224,410.5" fill="#2E9E6B" fill-opacity="0.3" stroke="#2E9E6B" stroke-width="1.6"/>
<polyline points="170,183.6 578,183.6" fill="none" fill-opacity="1" stroke="#333333" stroke-width="1.2"/>
<text x="584" y="187.6" fill="#333333" text-anchor="start" font-size="13">P2（最上点）＝掘込面h=270に対応</text>
<polyline points="170,474.4 578,474.4" fill="none" fill-opacity="1" stroke="#8a857a" stroke-width="1.2" stroke-dasharray="6 3"/>
<text x="164" y="478.4" fill="#8a857a" text-anchor="end" font-size="13">P1（CSP最下点）</text>
<polyline points="170,483.6 578,483.6" fill="none" fill-opacity="1" stroke="#2C6FB0" stroke-width="1.2" stroke-dasharray="6 3"/>
<text x="584" y="487.6" fill="#2C6FB0" text-anchor="start" font-size="13">許される最下点＝h=245に対応（P2−25）</text>
<circle cx="388.2" cy="483.6" r="4" fill="#2E9E6B"/>
<text x="380.2" y="501.6" fill="#2E9E6B" text-anchor="end" font-size="13">板の最下点</text>
<text x="234" y="366" fill="#222" text-anchor="end" font-size="13">P0</text>
<text x="482.6" y="490.4" fill="#222" text-anchor="start" font-size="13">P1</text>
<text x="317" y="177.6" fill="#222" text-anchor="end" font-size="13">P2</text>
<text x="528.1" y="381.3" fill="#C0392B" text-anchor="start" font-size="13">前面</text>
<text x="216" y="414.5" fill="#2E9E6B" text-anchor="end" font-size="13">支持板（0.7D=15.0）</text>
<circle cx="400.8" cy="329" r="5" fill="none" stroke="#D35400" stroke-width="2"/>
<polyline points="400.8,329 400.8,519.6" fill="none" fill-opacity="1" stroke="#D35400" stroke-width="1.2" stroke-dasharray="3 3"/>
<polyline points="406.2,443.1 406.2,519.6" fill="none" fill-opacity="1" stroke="#2E9E6B" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="396.8" y="535.6" fill="#D35400" text-anchor="end" font-size="13">(重心 d=13.23)</text>
<text x="410.2" y="535.6" fill="#2E9E6B" text-anchor="start" font-size="13">支持端 d=13.68</text>
<text x="408.8" y="323" fill="#D35400" text-anchor="start" font-size="13">(重心・均質仮定)</text>
<text x="490.6" y="434.4" fill="#2C6FB0" text-anchor="start" font-size="13">↘ 底面の下り方向（LP側・前面側）</text>
<text x="900" y="150" fill="#222" text-anchor="start" font-size="14" font-weight="bold">■ 支持率 r と t下 の上限（計算、余裕寸法0）</text>
<text x="900" y="180" fill="#222" text-anchor="start" font-size="13" font-weight="bold">支持率 r</text>
<text x="980" y="180" fill="#222" text-anchor="start" font-size="13" font-weight="bold">P1を下げない上限</text>
<text x="1130" y="180" fill="#222" text-anchor="start" font-size="13" font-weight="bold">すき間0.77も使う上限</text>
<text x="1300" y="180" fill="#222" text-anchor="start" font-size="13" font-weight="bold">支持端 d</text>
<text x="900" y="202" fill="#222" text-anchor="start" font-size="13">0.5</text>
<text x="980" y="202" fill="#222" text-anchor="start" font-size="13">4.76</text>
<text x="1130" y="202" fill="#222" text-anchor="start" font-size="13">5.60</text>
<text x="1300" y="202" fill="#222" text-anchor="start" font-size="13">9.77</text>
<text x="900" y="224" fill="#222" text-anchor="start" font-size="13">0.6</text>
<text x="980" y="224" fill="#222" text-anchor="start" font-size="13">3.81</text>
<text x="1130" y="224" fill="#222" text-anchor="start" font-size="13">4.65</text>
<text x="1300" y="224" fill="#222" text-anchor="start" font-size="13">11.73</text>
<text x="900" y="246" fill="#2E9E6B" text-anchor="start" font-size="13">0.7</text>
<text x="980" y="246" fill="#2E9E6B" text-anchor="start" font-size="13">2.86</text>
<text x="1130" y="246" fill="#2E9E6B" text-anchor="start" font-size="13">3.70</text>
<text x="1300" y="246" fill="#2E9E6B" text-anchor="start" font-size="13">13.68</text>
<text x="900" y="268" fill="#222" text-anchor="start" font-size="13">0.8</text>
<text x="980" y="268" fill="#222" text-anchor="start" font-size="13">1.91</text>
<text x="1130" y="268" fill="#222" text-anchor="start" font-size="13">2.74</text>
<text x="1300" y="268" fill="#222" text-anchor="start" font-size="13">15.64</text>
<text x="900" y="290" fill="#222" text-anchor="start" font-size="13">0.9</text>
<text x="980" y="290" fill="#222" text-anchor="start" font-size="13">0.95</text>
<text x="1130" y="290" fill="#222" text-anchor="start" font-size="13">1.79</text>
<text x="1300" y="290" fill="#222" text-anchor="start" font-size="13">17.59</text>
<text x="900" y="312" fill="#222" text-anchor="start" font-size="13">1.0</text>
<text x="980" y="312" fill="#222" text-anchor="start" font-size="13">0.00</text>
<text x="1130" y="312" fill="#222" text-anchor="start" font-size="13">0.84</text>
<text x="1300" y="312" fill="#222" text-anchor="start" font-size="13">19.55</text>
<text x="900" y="346" fill="#222" text-anchor="start" font-size="13">式：t下 ≦ ((1−r)·D·sin24° + 0.77) / cos24°</text>
<text x="900" y="366" fill="#444" text-anchor="start" font-size="13">　　r=1.0（全面）で0.84 → K015の式①（t前=t後=t上=0）と一致</text>
<text x="900" y="386" fill="#444" text-anchor="start" font-size="13">　　「P1を下げない上限」＝(1−r)·D·tan24°。板の最下点がP1と同じ高さになる厚さ</text>
<text x="900" y="406" fill="#222" text-anchor="start" font-size="13">前提：板は底面に沿ってP0から始まる。t上・t前・t後・t左・t右は0</text>
<text x="900" y="426" fill="#222" text-anchor="start" font-size="13">重心：CSPの質量分布の資料はないため、均質と仮定した参考位置</text>
<text x="900" y="446" fill="#444" text-anchor="start" font-size="13">　　r=0.7のとき、支持端と重心（均質仮定）のd方向の差は0.45</text>
<text x="900" y="466" fill="#222" text-anchor="start" font-size="13">底面は24°傾いているため、板の上のCSPには下り方向（LP側）への力がかかる</text>
</svg>