<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="880" viewBox="0 0 1240 880" font-family="Noto Sans CJK JP, Hiragino Sans, Meiryo, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a333333" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="a2C6FB0" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2C6FB0"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="40" fill="#222" text-anchor="start" font-size="18" font-weight="bold">K030　荷重の通り道と落下につながる故障点（STEP3 3-2）</text>
<text x="40" y="62" fill="#222" text-anchor="start" font-size="12">作成 2609290005　スコットラッセル（A00-002）・両側支持（D04-001）を前提にした概念図。部品の形・駆動方式は未定（STEP4）。矢印は重さが流れる向き（下から上へ）</text>
<rect x="60" y="90" width="640" height="44" rx="6" fill="#e6e3dc" stroke="#8a857a" stroke-width="1.5"/>
<text x="380" y="117" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">梁1・梁2（構造材、M6までのねじ止め：A00-005）</text>
<rect x="60" y="180" width="290" height="50" rx="6" fill="#f4f4f4" stroke="#333333" stroke-width="1.5"/>
<text x="205" y="202" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">左の取付部（ブラケット＋ねじ）</text>
<text x="205" y="219" text-anchor="middle" font-size="11" fill="#555">→梁1</text>
<rect x="410" y="180" width="290" height="50" rx="6" fill="#f4f4f4" stroke="#333333" stroke-width="1.5"/>
<text x="555" y="202" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">右の取付部（ブラケット＋ねじ）</text>
<text x="555" y="219" text-anchor="middle" font-size="11" fill="#555">→梁2</text>
<rect x="60" y="280" width="290" height="60" rx="6" fill="#f4f4f4" stroke="#333333" stroke-width="1.5"/>
<text x="205" y="307" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">左リンク（腕・ピン）</text>
<text x="205" y="324" text-anchor="middle" font-size="11" fill="#555">スコットラッセル</text>
<rect x="410" y="280" width="290" height="60" rx="6" fill="#f4f4f4" stroke="#333333" stroke-width="1.5"/>
<text x="555" y="307" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">右リンク（腕・ピン）</text>
<text x="555" y="324" text-anchor="middle" font-size="11" fill="#555">スコットラッセル</text>
<rect x="160" y="395" width="440" height="50" rx="6" fill="#f4f4f4" stroke="#333333" stroke-width="1.5"/>
<text x="380" y="425" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">保持具（両側のリンクと接続）</text>
<rect x="160" y="490" width="440" height="60" rx="6" fill="#e8e8e8" stroke="#333333" stroke-width="1.5"/>
<text x="380" y="517" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">CSP 7.90kg（＋猫5kg：H23）</text>
<text x="380" y="534" text-anchor="middle" font-size="11" fill="#555">底面の部分支持板＋前面上角の爪（A03-001）</text>
<rect x="760" y="280" width="220" height="60" rx="6" fill="#eaf1f8" stroke="#2C6FB0" stroke-width="1.5"/>
<text x="870" y="307" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">駆動（モーター・伝達）</text>
<text x="870" y="324" text-anchor="middle" font-size="11" fill="#555">リンクの入力部を動かす／止める</text>
<rect x="760" y="180" width="220" height="50" rx="6" fill="#eaf1f8" stroke="#2C6FB0" stroke-width="1.5"/>
<text x="870" y="210" text-anchor="middle" font-size="13" fill="#222" font-weight="bold">駆動の取付部</text>
<line x1="380" y1="490" x2="380" y2="447" stroke="#333333" stroke-width="2" marker-end="url(#a333333)"/>
<line x1="260" y1="395" x2="205" y2="342" stroke="#333333" stroke-width="2" marker-end="url(#a333333)"/>
<line x1="500" y1="395" x2="555" y2="342" stroke="#333333" stroke-width="2" marker-end="url(#a333333)"/>
<line x1="205" y1="280" x2="205" y2="232" stroke="#333333" stroke-width="2" marker-end="url(#a333333)"/>
<line x1="555" y1="280" x2="555" y2="232" stroke="#333333" stroke-width="2" marker-end="url(#a333333)"/>
<line x1="205" y1="180" x2="205" y2="136" stroke="#333333" stroke-width="2" marker-end="url(#a333333)"/>
<line x1="555" y1="180" x2="555" y2="136" stroke="#333333" stroke-width="2" marker-end="url(#a333333)"/>
<line x1="760" y1="310" x2="702" y2="310" stroke="#2C6FB0" stroke-width="2" marker-end="url(#a2C6FB0)" stroke-dasharray="5 3"/>
<line x1="700" y1="318" x2="758" y2="318" stroke="#2C6FB0" stroke-width="2" marker-end="url(#a2C6FB0)" stroke-dasharray="5 3"/>
<line x1="870" y1="180" x2="870" y2="150" stroke="#2C6FB0" stroke-width="2" marker-end="url(#a2C6FB0)"/>
<line x1="870" y1="150" x2="702" y2="112" stroke="#2C6FB0" stroke-width="2"/>
<text x="725" y="300" fill="#2C6FB0" text-anchor="middle" font-size="11">入力部</text>
<text x="725" y="360" fill="#2C6FB0" text-anchor="middle" font-size="11">重さで押し返す力</text>
<circle cx="150" cy="520" r="15" fill="#C0392B"/>
<text x="150" y="525" fill="white" text-anchor="middle" font-size="12" font-weight="bold">F1</text>
<circle cx="140" cy="420" r="15" fill="#C0392B"/>
<text x="140" y="425" fill="white" text-anchor="middle" font-size="12" font-weight="bold">F2</text>
<circle cx="40" cy="310" r="15" fill="#C0392B"/>
<text x="40" y="315" fill="white" text-anchor="middle" font-size="12" font-weight="bold">F3</text>
<circle cx="40" cy="205" r="15" fill="#C0392B"/>
<text x="40" y="210" fill="white" text-anchor="middle" font-size="12" font-weight="bold">F4</text>
<circle cx="1000" cy="300" r="15" fill="#C0392B"/>
<text x="1000" y="305" fill="white" text-anchor="middle" font-size="12" font-weight="bold">F5</text>
<circle cx="1000" cy="205" r="15" fill="#C0392B"/>
<text x="1000" y="210" fill="white" text-anchor="middle" font-size="12" font-weight="bold">F4</text>
<circle cx="1000" cy="335" r="15" fill="#C0392B"/>
<text x="1000" y="340" fill="white" text-anchor="middle" font-size="12" font-weight="bold">F6</text>
<text x="40" y="600" fill="#222" text-anchor="start" font-size="14" font-weight="bold">■ 故障点と、落下を防ぐ考え方の候補（方式はまだ選ばない）</text>
<text x="40" y="628" fill="#222" text-anchor="start" font-size="12" font-weight="bold">点</text>
<text x="90" y="628" fill="#222" text-anchor="start" font-size="12" font-weight="bold">故障すると</text>
<text x="370" y="628" fill="#222" text-anchor="start" font-size="12" font-weight="bold">関係する危険事象</text>
<text x="560" y="628" fill="#222" text-anchor="start" font-size="12" font-weight="bold">考え方の候補</text>
<text x="40" y="652" fill="#C0392B" text-anchor="start" font-size="12" font-weight="bold">F1</text>
<text x="90" y="652" fill="#222" text-anchor="start" font-size="12">CSPが保持具から滑る・外れる</text>
<text x="370" y="652" fill="#222" text-anchor="start" font-size="12">H02、H23</text>
<text x="560" y="652" fill="#222" text-anchor="start" font-size="12">形で囲って拘束する／CSPを抱える補助ベルト（本体加工不可：D01-010）</text>
<text x="40" y="676" fill="#C0392B" text-anchor="start" font-size="12" font-weight="bold">F2</text>
<text x="90" y="676" fill="#222" text-anchor="start" font-size="12">保持具・保持具とリンクの接続が壊れる</text>
<text x="370" y="676" fill="#222" text-anchor="start" font-size="12">H01、H23</text>
<text x="560" y="676" fill="#222" text-anchor="start" font-size="12">安全率（3-6）／保持具から梁へ直接つなぐ別の経路（ワイヤ等）</text>
<text x="40" y="700" fill="#C0392B" text-anchor="start" font-size="12" font-weight="bold">F3</text>
<text x="90" y="700" fill="#222" text-anchor="start" font-size="12">片側のリンク（腕・ピン）が壊れる</text>
<text x="370" y="700" fill="#222" text-anchor="start" font-size="12">H01、H09</text>
<text x="560" y="700" fill="#222" text-anchor="start" font-size="12">片側だけでも全荷重を持てる強さにする（2系統の冗長）／安全率</text>
<text x="40" y="724" fill="#C0392B" text-anchor="start" font-size="12" font-weight="bold">F4</text>
<text x="90" y="724" fill="#222" text-anchor="start" font-size="12">取付ねじが抜ける・緩む（駆動も同じ）</text>
<text x="370" y="724" fill="#222" text-anchor="start" font-size="12">H01、H04、H16</text>
<text x="560" y="724" fill="#222" text-anchor="start" font-size="12">本数を増やして1本抜けても持つ／安全率／点検（STEP6）</text>
<text x="40" y="748" fill="#C0392B" text-anchor="start" font-size="12" font-weight="bold">F5</text>
<text x="90" y="748" fill="#222" text-anchor="start" font-size="12">駆動の伝達が切れる（ねじ・ベルト・歯車）</text>
<text x="370" y="748" fill="#222" text-anchor="start" font-size="12">H05</text>
<text x="560" y="748" fill="#222" text-anchor="start" font-size="12">リンクが自重でつぶれて急降下 → 自己保持（逆に回らない伝達）／ブレーキ／落下速度で止まる装置</text>
<text x="40" y="772" fill="#C0392B" text-anchor="start" font-size="12" font-weight="bold">F6</text>
<text x="90" y="772" fill="#222" text-anchor="start" font-size="12">電気が切れて止めておけない</text>
<text x="370" y="772" fill="#222" text-anchor="start" font-size="12">H17</text>
<text x="560" y="772" fill="#222" text-anchor="start" font-size="12">電気がないと効くブレーキ（無励磁作動）／自己保持</text>
<text x="40" y="814" fill="#222" text-anchor="start" font-size="12">・スコットラッセルでは、CSPの重さが入力部を押し返す力になる。駆動が止めておけないとリンクがつぶれて下がる（F5・F6）</text>
<text x="40" y="835" fill="#222" text-anchor="start" font-size="12">・左右2系統（D04-001）は、片側で全荷重を持てる強さにすれば、F3・F4に対して冗長になる。持てなければ冗長にはならない</text>
<text x="40" y="856" fill="#222" text-anchor="start" font-size="12">・F1とF2は左右に共通の1系統。ここが壊れると、左右のリンクが健全でも落ちる</text>
</svg>