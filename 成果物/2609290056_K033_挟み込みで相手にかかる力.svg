<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="770" viewBox="0 0 1180 770" font-family="Noto Sans CJK JP, Hiragino Sans, Meiryo, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="mC0392B" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#C0392B"/></marker><marker id="m2C6FB0" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2C6FB0"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="40" fill="#222" text-anchor="start" font-size="18" font-weight="bold">K033　挟み込み・衝突で相手にかかる力（STEP3 3-4）</text>
<text x="40" y="62" fill="#222" text-anchor="start" font-size="12">作成 2609290056　概念図。W＝CSPの重さ 77.5 N（7.90kg）。保持具・リンクの重さは未定のため含まない。F駆動＝駆動がCSPを押す力（向きは図の矢印）</text>
<text x="60" y="100" fill="#222" text-anchor="start" font-size="14" font-weight="bold">① 下降中に、下の物（頭・手）に当たる</text>
<rect x="120" y="140" width="200" height="60" fill="#e8e8e8" fill-opacity="1" stroke="#333333" stroke-width="1.5"/>
<text x="220" y="175" fill="#222" text-anchor="middle" font-size="13" font-weight="bold">CSP</text>
<line x1="220" y1="200" x2="220" y2="250" stroke="#C0392B" stroke-width="3" marker-end="url(#mC0392B)"/>
<text x="232" y="235" fill="#C0392B" text-anchor="start" font-size="12">W（重さ）</text>
<line x1="300" y1="110" x2="300" y2="138" stroke="#2C6FB0" stroke-width="3" marker-end="url(#m2C6FB0)"/>
<text x="308" y="125" fill="#2C6FB0" text-anchor="start" font-size="12">F駆動（下向きに押す場合）</text>
<ellipse cx="220" cy="285" rx="45" ry="32" fill="#f6e0c8" stroke="#333333"/>
<text x="220" y="290" fill="#222" text-anchor="middle" font-size="13">頭・手</text>
<text x="60" y="350" fill="#222" text-anchor="start" font-size="12" font-weight="bold">相手にかかる力 ＝ W ＋ 下向きのF駆動</text>
<text x="60" y="371" fill="#222" text-anchor="start" font-size="12">・駆動が押さなくても、重さWは全部相手に乗る</text>
<text x="60" y="392" fill="#222" text-anchor="start" font-size="12">・駆動から見ると、重さを相手が支えるので</text>
<text x="60" y="413" fill="#222" text-anchor="start" font-size="12">　負荷が「減る」 → 検出は負荷の減少（抜け）</text>
<text x="60" y="434" fill="#222" text-anchor="start" font-size="12">・Wは保持具・リンクを含めると77.5 Nより大きい</text>
<text x="560" y="100" fill="#222" text-anchor="start" font-size="14" font-weight="bold">② 上昇中に、上の物（猫・手）を天井との間に挟む</text>
<line x1="580" y1="130" x2="880" y2="130" stroke="#333333" stroke-width="4"/>
<text x="890" y="135" fill="#222" text-anchor="start" font-size="12">掘込面・梁</text>
<ellipse cx="730" cy="160" rx="45" ry="26" fill="#f6e0c8" stroke="#333333"/>
<text x="730" y="165" fill="#222" text-anchor="middle" font-size="13">猫・手</text>
<rect x="630" y="188" width="200" height="60" fill="#e8e8e8" fill-opacity="1" stroke="#333333" stroke-width="1.5"/>
<text x="730" y="223" fill="#222" text-anchor="middle" font-size="13" font-weight="bold">CSP</text>
<line x1="810" y1="300" x2="810" y2="250" stroke="#2C6FB0" stroke-width="3" marker-end="url(#m2C6FB0)"/>
<text x="820" y="285" fill="#2C6FB0" text-anchor="start" font-size="12">F駆動（上向き）</text>
<line x1="700" y1="248" x2="700" y2="290" stroke="#C0392B" stroke-width="3" marker-end="url(#mC0392B)"/>
<text x="640" y="280" fill="#C0392B" text-anchor="start" font-size="12">W</text>
<text x="560" y="350" fill="#222" text-anchor="start" font-size="12" font-weight="bold">相手にかかる力 ＝ F駆動 − W</text>
<text x="560" y="371" fill="#222" text-anchor="start" font-size="12">・駆動は重さを持ち上げたうえで、さらに押す</text>
<text x="560" y="392" fill="#222" text-anchor="start" font-size="12">・駆動から見ると負荷が「増える」 → 検出は負荷の増加（過負荷）</text>
<text x="560" y="413" fill="#222" text-anchor="start" font-size="12">・猫が上に乗ったまま上がる（H13）のはこちら</text>
<text x="60" y="500" fill="#222" text-anchor="start" font-size="14" font-weight="bold">■ 力の大きさの比較（N）</text>
<text x="360" y="536" fill="#222" text-anchor="end" font-size="12">CSPの重さ W</text>
<rect x="370" y="522" width="92.9988" height="20" fill="#8a857a" fill-opacity="0.7"/>
<text x="468.9988" y="537" fill="#222" text-anchor="start" font-size="12">77.5 N</text>
<text x="360" y="566" fill="#222" text-anchor="end" font-size="12">猫 5kg の重さ</text>
<rect x="370" y="552" width="58.86" height="20" fill="#6A5FD0" fill-opacity="0.7"/>
<text x="434.86" y="567" fill="#222" text-anchor="start" font-size="12">49.1 N</text>
<text x="360" y="596" fill="#222" text-anchor="end" font-size="12">CSP＋猫</text>
<rect x="370" y="582" width="151.8588" height="20" fill="#8a857a" fill-opacity="0.7"/>
<text x="527.8588" y="597" fill="#222" text-anchor="start" font-size="12">126.5 N</text>
<text x="360" y="626" fill="#222" text-anchor="end" font-size="12">挟み込みの静的な力の上限（多くの規格）</text>
<rect x="370" y="612" width="180.0" height="20" fill="#2E9E6B" fill-opacity="0.7"/>
<text x="556.0" y="627" fill="#222" text-anchor="start" font-size="12">150 N</text>
<text x="360" y="656" fill="#222" text-anchor="end" font-size="12">動力ゲートの挟み込みの上限（EN 12453）</text>
<rect x="370" y="642" width="480.0" height="20" fill="#D35400" fill-opacity="0.7"/>
<text x="856.0" y="657" fill="#222" text-anchor="start" font-size="12">400 N</text>
<text x="60" y="690" fill="#222" text-anchor="start" font-size="12">・下降の向き（①）では、CSPの重さそのものが相手にかかる。重さだけなら150Nより小さいが、保持具・リンクの重さと、駆動が下向きに押す力しだいで越える</text>
<text x="60" y="711" fill="#222" text-anchor="start" font-size="12">・検出の向きが上昇と下降で逆（①は負荷の減少、②は負荷の増加）。検出のしかたは両方向で別に考える必要がある</text>
<text x="60" y="732" fill="#222" text-anchor="start" font-size="12">・スコットラッセルでは、CSPにかかる力と駆動の力の比がリンクの角度で変わる。同じ力でも、位置によって駆動側で見える負荷の変化が違う（感度が変わる）→ STEP4</text>
</svg>