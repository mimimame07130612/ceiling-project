<rect width="100%" height="100%" fill="white"/>
<text x="40" y="40" fill="#222" text-anchor="start" font-size="18" font-weight="bold">K034　停電・異常時の状態の流れ（STEP3 3-5）</text>
<text x="40" y="62" fill="#222" text-anchor="start" font-size="12">作成 2609290119　灰の枠＝通常の状態、赤の枠＝止まっている異常の状態。どの止まっている状態でも、落下止め（D04-003）がCSPを保持する。橙の①〜③はまだ決めていない所</text>
<rect x="80.0" y="140.0" width="200" height="60" rx="10" fill="#f4f4f4" stroke="#8a857a" stroke-width="2"/>
<text x="180" y="166" fill="#222" text-anchor="middle" font-size="14" font-weight="bold">収納（停止）</text>
<text x="180" y="185" fill="#555" text-anchor="middle" font-size="11">天井付近</text>
<rect x="420.0" y="140.0" width="200" height="60" rx="10" fill="#f4f4f4" stroke="#8a857a" stroke-width="2"/>
<text x="520" y="166" fill="#222" text-anchor="middle" font-size="14" font-weight="bold">下降中</text>
<text x="520" y="185" fill="#555" text-anchor="middle" font-size="11">2cm/s以下</text>
<rect x="760.0" y="140.0" width="200" height="60" rx="10" fill="#f4f4f4" stroke="#8a857a" stroke-width="2"/>
<text x="860" y="166" fill="#222" text-anchor="middle" font-size="14" font-weight="bold">使用（停止）</text>
<text x="860" y="185" fill="#555" text-anchor="middle" font-size="11">SCの前</text>
<rect x="420.0" y="300.0" width="200" height="60" rx="10" fill="#f4f4f4" stroke="#8a857a" stroke-width="2"/>
<text x="520" y="326" fill="#222" text-anchor="middle" font-size="14" font-weight="bold">上昇中</text>
<text x="520" y="345" fill="#555" text-anchor="middle" font-size="11">2cm/s以下</text>
<line x1="280" y1="160" x2="418" y2="160" stroke="#333333" stroke-width="2" marker-end="url(#m333333)"/>
<text x="349.0" y="152.0" fill="#333333" text-anchor="middle" font-size="11">下降の指令</text>
<line x1="620" y1="160" x2="758" y2="160" stroke="#333333" stroke-width="2" marker-end="url(#m333333)"/>
<text x="689.0" y="152.0" fill="#333333" text-anchor="middle" font-size="11">端点（S02）</text>
<line x1="860" y1="200" x2="622" y2="318" stroke="#333333" stroke-width="2" marker-end="url(#m333333)"/>
<text x="781.0" y="259.0" fill="#333333" text-anchor="start" font-size="11">上昇の指令</text>
<line x1="418" y1="330" x2="180" y2="202" stroke="#333333" stroke-width="2" marker-end="url(#m333333)"/>
<text x="259.0" y="276.0" fill="#333333" text-anchor="end" font-size="11">端点（S01）</text>
<rect x="230.0" y="488.0" width="260" height="64" rx="10" fill="#fbe9e7" stroke="#C0392B" stroke-width="2"/>
<text x="360" y="516" fill="#222" text-anchor="middle" font-size="14" font-weight="bold">異常停止</text>
<text x="360" y="535" fill="#555" text-anchor="middle" font-size="11">検出で停止（反転はS03のみ）</text>
<rect x="630.0" y="488.0" width="260" height="64" rx="10" fill="#fbe9e7" stroke="#C0392B" stroke-width="2"/>
<text x="760" y="516" fill="#222" text-anchor="middle" font-size="14" font-weight="bold">停電停止</text>
<text x="760" y="535" fill="#555" text-anchor="middle" font-size="11">電気が切れた位置で止まる</text>
<line x1="500" y1="202" x2="380" y2="486" stroke="#C0392B" stroke-width="2" marker-end="url(#mC0392B)"/>
<text x="330" y="420" fill="#C0392B" text-anchor="end" font-size="11">検出 S03〜S06</text>
<line x1="520" y1="362" x2="420" y2="486" stroke="#C0392B" stroke-width="2" marker-end="url(#mC0392B)"/>
<line x1="560" y1="202" x2="720" y2="486" stroke="#C0392B" stroke-width="2" marker-end="url(#mC0392B)" stroke-dasharray="5 3"/>
<text x="650.0" y="344.0" fill="#C0392B" text-anchor="start" font-size="11">停電</text>
<line x1="560" y1="362" x2="740" y2="486" stroke="#C0392B" stroke-width="2" marker-end="url(#mC0392B)" stroke-dasharray="5 3"/>
<line x1="360" y1="553" x2="360" y2="640" stroke="#D35400" stroke-width="2" marker-end="url(#mD35400)"/>
<circle cx="385" cy="600" r="13" fill="#D35400"/>
<text x="385" y="605" fill="white" text-anchor="middle" font-size="13" font-weight="bold">②</text>
<rect x="230.0" y="645.0" width="260" height="60" rx="10" fill="#fdf1e6" stroke="#D35400" stroke-width="2"/>
<text x="360" y="671" fill="#222" text-anchor="middle" font-size="14" font-weight="bold">再開の操作</text>
<text x="360" y="690" fill="#555" text-anchor="middle" font-size="11">人が確認してから／自動で</text>
<line x1="760" y1="553" x2="760" y2="640" stroke="#D35400" stroke-width="2" marker-end="url(#mD35400)"/>
<text x="770.0" y="596.5" fill="#D35400" text-anchor="start" font-size="11">復電</text>
<circle cx="735" cy="600" r="13" fill="#D35400"/>
<text x="735" y="605" fill="white" text-anchor="middle" font-size="13" font-weight="bold">③</text>
<rect x="630.0" y="645.0" width="260" height="60" rx="10" fill="#fdf1e6" stroke="#D35400" stroke-width="2"/>
<text x="760" y="671" fill="#222" text-anchor="middle" font-size="14" font-weight="bold">復電後の待機</text>
<text x="760" y="690" fill="#555" text-anchor="middle" font-size="11">勝手に動かない（H19）</text>
<line x1="890" y1="555" x2="1010" y2="640" stroke="#D35400" stroke-width="2" marker-end="url(#mD35400)" stroke-dasharray="3 3"/>
<circle cx="965" cy="590" r="13" fill="#D35400"/>
<text x="965" y="595" fill="white" text-anchor="middle" font-size="13" font-weight="bold">①</text>
<rect x="960.0" y="645.0" width="220" height="60" rx="10" fill="#fdf1e6" stroke="#D35400" stroke-width="2"/>
<text x="1070" y="671" fill="#222" text-anchor="middle" font-size="14" font-weight="bold">手で動かす</text>
<text x="1070" y="690" fill="#555" text-anchor="middle" font-size="11">電気なしで収納へ戻す（H18）</text>
<line x1="230" y1="645" x2="180" y2="202" stroke="#D35400" stroke-width="2" marker-end="url(#mD35400)" stroke-dasharray="3 3"/>
<text x="195.0" y="423.5" fill="#D35400" text-anchor="end" font-size="11">収納へ戻す</text>
<text x="40" y="760" fill="#222" text-anchor="start" font-size="14" font-weight="bold">■ 決めること</text>
<text x="40" y="786" fill="#222" text-anchor="start" font-size="12" font-weight="bold">① 途中で止まって電気が戻らないとき、手で収納位置まで戻せるようにするか（H18：頭の高さ・SCと干渉する位置で止まっている場合）</text>
<text x="40" y="807" fill="#222" text-anchor="start" font-size="12">　候補：戻せるようにする（手回し・落下止めを手で解除する等。解除そのものが落下の危険になる）／戻せなくてよい（復電を待つ）</text>
<text x="40" y="828" fill="#222" text-anchor="start" font-size="12" font-weight="bold">② 異常停止のあと、どうやって再開するか</text>
<text x="40" y="849" fill="#222" text-anchor="start" font-size="12">　候補：人が確認して再開の操作をする／原因がなくなったら自動で再開する。どの向き（収納／使用）へ動かすか</text>
<text x="40" y="870" fill="#222" text-anchor="start" font-size="12" font-weight="bold">③ 復電したあと、どうするか</text>
<text x="40" y="891" fill="#222" text-anchor="start" font-size="12">　候補：何もしないで待つ（次の指令を待つ）／自動で収納位置へ戻る。停電中に出ていた指令は捨てる（H19）</text>
</svg>