<text x="443.7" y="409.6" font-size="10" fill="#2C6FB0" text-anchor="end">B右</text>
<text x="270.0" y="459.8" font-size="11" fill="#222" text-anchor="middle">L字の脚は右の長リンクの真上（x=162.7〜165.2）を通る</text>
<text x="560.0" y="78.0" font-size="13" fill="#000" text-anchor="start">(2) 正面断面 d=160（収納時、脚と長リンクの位置）</text>
