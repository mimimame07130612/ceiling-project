<text x="562.0" y="479.0" font-size="10" fill="#333" text-anchor="start">梁下面 h=254.5</text>
<text x="637.0" y="216.8" font-size="11" fill="#c0392b" text-anchor="middle">すき間 1.62</text>
<line x1="681.0" y1="197.0" x2="681.0" y2="232.6562258235523" stroke="#c0392b"/>
<text x="560.0" y="562.0" font-size="11" fill="#222" text-anchor="start">長リンクは収納時φ=7°。d=160での上端 h=265.88（中心263.86）。動くとBのまわりで下がる</text>
<text x="40.0" y="620.0" font-size="13" fill="#000" text-anchor="start">(3) 駆動を1か所で押すときに横棒とガイドにかかるこじれ（収納時、常時荷重、リンクの重さを含まない）</text>
<text x="40.0" y="648.0" font-size="12" fill="#222" text-anchor="start">片側のBを押す力 F = Wside·cotφ収納 = 75×cot7.0° = 611 N（K090、左右同じとする）</text>
<text x="40.0" y="670.0" font-size="12" fill="#222" text-anchor="start">駆動を x=xd で押すと、横棒は左右のBから F ずつ受け、こじれ M = F×|2·xd − xL − xR|（xL=95.55・xR=163.95：リンク面、A06-004）</text>
<text x="40.0" y="692.0" font-size="12" fill="#222" text-anchor="start">左の端（xd=xL）で押すと M = 611×0.684 = 418 N·m。ガイド2個の公表値の合計 436 N·m に対して余裕1.04倍（必要な安全率4に届かない）</text>
<text x="40.0" y="714.0" font-size="12" fill="#222" text-anchor="start">安全率4で受けるには M ≦ 109 N·m → |2·xd − 259.5| ≦ 17.8 → xd = 120.8〜138.7（左右の真ん中 x=129.75 の近く）</text>
<text x="40.0" y="736.0" font-size="12" fill="#222" text-anchor="start">真ん中付近は照明の列（x=129.65）の真下。収納時に台形ねじ・ナット・モーターを置くと配光（A00-006）に入る（K105）</text>
<text x="40.0" y="758.0" font-size="12" fill="#222" text-anchor="start">ガイドのヨー方向の許容モーメントは MA（0.218kN·m、A06-007）と同じと仮定（未確認）。横棒そのものも同じ M を曲げで受ける（断面の計算は未実施）</text>
