<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 1050" width="1350" height="1050" font-family="Noto Sans CJK JP, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1350" height="1050" fill="#fff"/>
<text x="20" y="30" font-size="18" font-weight="bold">K116　アルミ角パイプ25×50×2のリンクの継手のつなぎ方（案）</text>
<text x="20" y="50" font-size="11" fill="#555">作成 2610042037　部屋を含まない部分詳細（F7 d）。単位mm。形・寸法はすべて仮。差し込み部品・スリーブ・ボルトの寸法は未選定</text>
<text x="20.0" y="85.0" font-size="13" fill="#000" text-anchor="start">(1) 長リンク（B–A–C、ピン間 896.8）と短リンクOA（O–A、448.4）：面内で見た差し込み部品の位置</text>
<rect x="130.0" y="120.0" width="1100.3" height="34.5" fill="#B4B2A9" fill-opacity="0.35" stroke="#444" stroke-width="1" />
