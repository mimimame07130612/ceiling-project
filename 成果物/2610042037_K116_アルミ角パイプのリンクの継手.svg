<text x="680.2" y="175.0" font-size="11" fill="#222" text-anchor="middle">A</text>
<circle cx="1195.8" cy="137.0" r="5.5" fill="#333" fill-opacity="0.8" stroke="#444"/>
<text x="1195.8" y="175.0" font-size="11" fill="#222" text-anchor="middle">B</text>
<rect x="130.0" y="210.0" width="584.7" height="34.5" fill="#B4B2A9" fill-opacity="0.35" stroke="#444" stroke-width="1" />
<rect x="130.0" y="212.0" width="69.0" height="30.5" fill="#85B7EB" fill-opacity="0.7" stroke="#444" stroke-width="1" />
<rect x="645.7" y="212.0" width="69.0" height="30.5" fill="#85B7EB" fill-opacity="0.7" stroke="#444" stroke-width="1" />
<text x="124.0" y="230.0" font-size="12" fill="#000" text-anchor="end">短リンクOA</text>
<circle cx="164.5" cy="227.0" r="5.5" fill="#333" fill-opacity="0.8" stroke="#444"/>
<text x="164.5" y="265.0" font-size="11" fill="#222" text-anchor="middle">O</text>
<circle cx="680.2" cy="227.0" r="5.5" fill="#333" fill-opacity="0.8" stroke="#444"/>
<text x="680.2" y="265.0" font-size="11" fill="#222" text-anchor="middle">A</text>
<text x="130.0" y="295.0" font-size="11" fill="#333" text-anchor="start">灰：角パイプ（外25×50、肉厚2、内21×46）。青：中実の差し込み部品（内21×46に入る角材、業者加工）。ピン穴は差し込み部品ごと貫通。端はピン中心から30はみ出す</text>
<text x="130.0" y="313.0" font-size="11" fill="#333" text-anchor="start">長リンクの中央Aの差し込み部品は、パイプの端から差し込んで位置を合わせ、h方向のボルト2本（M5、仮）で留める</text>
<text x="230.0" y="385.0" font-size="12" fill="#000" text-anchor="middle">(2) B・C′：ピンを長リンクに固定、ブッシュはコの字の両側</text>
<rect x="155.0" y="410.0" width="150.0" height="300.0" fill="#B4B2A9" fill-opacity="0.5" stroke="#444" stroke-width="1" />
<rect x="167.0" y="422.0" width="126.0" height="276.0" fill="#85B7EB" fill-opacity="0.75" stroke="#444" stroke-width="1" />
<rect x="155.0" y="500.0" width="150.0" height="120.0" fill="#5F5E5A" fill-opacity="0.85" stroke="#444" stroke-width="1" />
<rect x="50.0" y="524.0" width="360.0" height="72.0" fill="#333" fill-opacity="0.9" stroke="#444" stroke-width="1" />
<rect x="95.0" y="470.0" width="60.0" height="180.0" fill="#9b6fc0" fill-opacity="0.35" stroke="#444" stroke-width="1" />
<rect x="95.0" y="512.0" width="60.0" height="96.0" fill="#E6A23C" fill-opacity="0.9" stroke="#444" stroke-width="1" />
<rect x="305.0" y="470.0" width="60.0" height="180.0" fill="#9b6fc0" fill-opacity="0.35" stroke="#444" stroke-width="1" />
<rect x="305.0" y="512.0" width="60.0" height="96.0" fill="#E6A23C" fill-opacity="0.9" stroke="#444" stroke-width="1" />
<text x="20.0" y="800.0" font-size="10" fill="#222" text-anchor="start">鋼スリーブ（外径20、仮）を差し込み部品ごと圧入し、ピンφ12をスリーブに固定</text>
<text x="20.0" y="816.0" font-size="10" fill="#222" text-anchor="start">ブッシュ中心間35（A06-003）。面外モーメントはスリーブ→差し込み部品→パイプで受ける</text>
<text x="640.0" y="385.0" font-size="12" fill="#000" text-anchor="middle">(3) A：ピンを長リンクに固定、OA側にブッシュ2個（間隔15）</text>
<rect x="490.0" y="410.0" width="150.0" height="300.0" fill="#B4B2A9" fill-opacity="0.5" stroke="#444" stroke-width="1" />
<rect x="502.0" y="422.0" width="126.0" height="276.0" fill="#85B7EB" fill-opacity="0.75" stroke="#444" stroke-width="1" />
<rect x="640.0" y="410.0" width="150.0" height="300.0" fill="#B4B2A9" fill-opacity="0.5" stroke="#444" stroke-width="1" />
<rect x="652.0" y="422.0" width="126.0" height="276.0" fill="#85B7EB" fill-opacity="0.75" stroke="#444" stroke-width="1" />
<rect x="490.0" y="500.0" width="150.0" height="120.0" fill="#5F5E5A" fill-opacity="0.85" stroke="#444" stroke-width="1" />
<rect x="478.0" y="524.0" width="324.0" height="72.0" fill="#333" fill-opacity="0.9" stroke="#444" stroke-width="1" />
<rect x="646.0" y="512.0" width="48.0" height="96.0" fill="#E6A23C" fill-opacity="0.9" stroke="#444" stroke-width="1" />
<rect x="736.0" y="512.0" width="48.0" height="96.0" fill="#E6A23C" fill-opacity="0.9" stroke="#444" stroke-width="1" />
<text x="565.0" y="740.0" font-size="10" fill="#222" text-anchor="middle">長リンク</text>
<text x="715.0" y="740.0" font-size="10" fill="#222" text-anchor="middle">OA</text>
<text x="640.0" y="800.0" font-size="10" fill="#222" text-anchor="middle">OAのブッシュは差し込み部品とパイプの両側の壁を通して圧入（ブッシュ中心間15）</text>
<text x="1080.0" y="385.0" font-size="12" fill="#000" text-anchor="middle">(4) O：OAに球面滑り軸受（外径22）、ピンφ12両持ち</text>
<rect x="1005.0" y="410.0" width="150.0" height="300.0" fill="#B4B2A9" fill-opacity="0.5" stroke="#444" stroke-width="1" />
<rect x="1017.0" y="422.0" width="126.0" height="276.0" fill="#85B7EB" fill-opacity="0.75" stroke="#444" stroke-width="1" />
<rect x="1032.0" y="494.0" width="96.0" height="132.0" fill="#E6A23C" fill-opacity="0.9" stroke="#444" stroke-width="1" />
<rect x="912.0" y="524.0" width="336.0" height="72.0" fill="#333" fill-opacity="0.9" stroke="#444" stroke-width="1" />
<rect x="924.0" y="440.0" width="36.0" height="240.0" fill="#9b6fc0" fill-opacity="0.35" stroke="#444" stroke-width="1" />
<rect x="1200.0" y="440.0" width="36.0" height="240.0" fill="#5F5E5A" fill-opacity="0.5" stroke="#444" stroke-width="1" />
<text x="942.0" y="428.0" font-size="10" fill="#222" text-anchor="middle">外板</text>
<text x="1218.0" y="428.0" font-size="10" fill="#222" text-anchor="middle">スペーサー</text>
<text x="1080.0" y="800.0" font-size="10" fill="#222" text-anchor="middle">軸受は差し込み部品に圧入。パイプの壁は軸受の外径より大きく逃がす（仮）</text>
<text x="20.0" y="880.0" font-size="12" fill="#222" text-anchor="start">確かめが要る点（K115の計算本体でA3を回した値、安全率込み）：</text>
<text x="20.0" y="902.0" font-size="12" fill="#222" text-anchor="start">・ピン固定部の面圧：長リンクがピンを固定して受ける面外モーメント B 142.8・C 120.2・A 64.9 N·m。差し込み部（x方向の長さ25）で受けると、</text>
<text x="20.0" y="924.0" font-size="12" fill="#222" text-anchor="start">　端の面圧の目安 6M/(D·L²)：ピンφ12を直接アルミに入れると B で 114 MPa（A6063-T5の仮の許容110を超える）→ 鋼スリーブ外径20にすると 69 MPa（余裕1.6）</text>
<text x="20.0" y="946.0" font-size="12" fill="#222" text-anchor="start">・ブッシュ1個の力 A 4,511・B 4,279・C′ 3,594 N（K114の平鋼・自重ありより小さい）。ブッシュの許容値は製品未選定のため未確認</text>
<text x="20.0" y="968.0" font-size="12" fill="#222" text-anchor="start">・差し込み部品とパイプの留め方（ボルト・接着・ピンの貫通だけ）、差し込み部品の材質、スリーブの圧入代は未検討</text>
<text x="20.0" y="990.0" font-size="12" fill="#222" text-anchor="start">・質量の目安：差し込み部品 21×46×60 は約0.16kg（アルミ）、片側5個（長リンク3・OA2）で約0.75kg。リンク本体と合わせ片側約1.8kg（ピン・ブッシュ・スリーブ別）</text>
</svg>