<text x="830" y="354" fill="#222" text-anchor="start" font-size="12">・右にリンクを置く分だけCSPが左に寄り、LP中央とのずれは w+2 増える</text>
<text x="830" y="375" fill="#222" text-anchor="start" font-size="12">・左右とも同じ幅wなら w≦7.7。左右の空きを使い切る</text>
<text x="830" y="396" fill="#222" text-anchor="start" font-size="12">・左の空きは右のwを使った残り。左のリンク幅もここに入る必要がある</text>
<text x="830" y="417" fill="#222" text-anchor="start" font-size="12">・リンクの幅wは機構しだいで、いまは値がない（STEP4）</text>
<text x="830" y="438" fill="#222" text-anchor="start" font-size="12">・梁下面より下（h=243.77〜254.5）は梁がないので右に出せる（K027）</text>
<text x="830" y="459" fill="#222" text-anchor="start" font-size="12">　→ 右のリンクを梁下面より下だけに収められるならCSPは寄せたまま</text>
<text x="830" y="480" fill="#222" text-anchor="start" font-size="12">　　ただし収まるかどうかは機構の形しだい（STEP4）</text>
