<polygon points="434.59,278.7 444.59,278.7 439.59,286.7" fill="#C0392B"/>
<text x="439.59" y="314.6" fill="#C0392B" text-anchor="middle" font-size="11">左側面での曲げモーメント 約 22.1 N·m（7.90kg×9.81×28.55 cm、保持具の質量は含まない）</text>
<text x="439.59" y="325.14" fill="#C0392B" text-anchor="middle" font-size="11">＋左右の重さの偏りでCSPが右下がりに傾こうとする（たわみ量はリンクの剛性しだい＝STEP4）</text>
<text x="40" y="440" fill="#222" text-anchor="start" font-size="14" font-weight="bold">B　両側で支える：左右に同じ幅 w（例 w=7.7＝上限）</text>
