<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" font-family="Noto Sans CJK JP, Hiragino Sans, Meiryo, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="40" fill="#222" text-anchor="start" font-size="18" font-weight="bold">K028　CSPの左右の支持と設置エリア幅の関係（M03-008の見直し）</text>
<text x="40" y="62" fill="#222" text-anchor="start" font-size="12">作成 2609282318　正面図（LP側から−d方向を見る）・収納時・単位cm。設置エリア x=89.5〜170（幅80.5）。リンク幅 w は未定（STEP4）のため変数。重心は左右中央と仮定（資料なし）</text>
<text x="40" y="100" fill="#222" text-anchor="start" font-size="14" font-weight="bold">A　現状：左側だけで支える（A03-002・A03-004）</text>
<rect x="64.8" y="134.8" width="65.1" height="96.1" fill="#8a857a" fill-opacity="0.6" stroke="#8a857a" stroke-width="1.2"/>
