<text x="379.45" y="654.6" fill="#D35400" text-anchor="middle" font-size="11">条件：57.1 + 2w + 余裕2×4 ≦ 80.5 → w ≦ 7.7</text>
<text x="830" y="110" fill="#222" text-anchor="start" font-size="14" font-weight="bold">■ 右側にリンク（幅w、両側に余裕2）を置く場合</text>
