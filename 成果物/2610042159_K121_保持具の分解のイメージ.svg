<text x="30" y="860" font-size="14" font-weight="bold">部品の種類（すべて仮）　曲げ・溶接なし：平らな板（寸法切り）＋市販のアングル＋ボルトで組む</text>
<text x="30" y="884" font-size="12">①　底板：アルミ板 厚3　→　寸法切り（オーダー）＋自分で穴あけ</text>
<text x="30" y="904" font-size="12">②　左側板：アルミ板 厚3　→　寸法切り（外形が多角形のためレーザー等）＋穴あけ</text>
<text x="30" y="924" font-size="12">③　右側板＝C′の内板：アルミ板 厚10　→　寸法切り＋ブッシュ穴は業者（精度）</text>
<text x="30" y="944" font-size="12">④　底板受け×2：市販アルミアングル　→　長さ切り（自分で切れないため購入時に切断）＋穴・タップ</text>
<text x="30" y="964" font-size="12">⑤　爪：市販アルミアングル　→　同上。ボルトで外せる＝CSPの出し入れ口</text>
<text x="30" y="984" font-size="12">⑥　爪の取付金具×2：市販の小さなL金具 or アングル　→　穴あけ</text>
<text x="30" y="1004" font-size="12">⑦　後ろの折り返し×2：市販アングルの短片　→　長さ切り＋穴あけ</text>
<text x="30" y="1024" font-size="12">⑧　左つなぎ板＋左コの字：アルミ板 厚10・平板＋スペーサー　→　寸法切り＋ブッシュ穴は業者</text>
<text x="30" y="1044" font-size="12">⑨　右コの字の外板：アルミ板 厚10＋スペーサー　→　同上</text>
<text x="30" y="1064" font-size="12">－　ゴム板：市販ゴムシート　→　カッターで切って貼る</text>
<text x="30" y="1084" font-size="12">－　ボルト・ナット：市販　→　</text>
<text x="30" y="1116" font-size="12" fill="#555">組む順（イメージ）：②③と①を④でつなぐ → ⑦を側板に付ける → CSPを前上から入れる → ⑤⑥の爪を付けて閉じる → ⑧⑨でリンクのCにつなぐ</text>
</svg>