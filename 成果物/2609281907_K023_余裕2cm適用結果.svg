<text x="70" y="841" fill="#222" text-anchor="start" font-size="13">使用d1=33：最下点 h=168.51、鉛直ストローク 75.26、前後移動 15.5、LP目への仰角 19.6°（余裕0のとき19.1°）</text>
<text x="70" y="861" fill="#222" text-anchor="start" font-size="13">使用d1=35：収納d1≧48.3、ストローク 74.86 ／ 使用d1=40：収納d1≧48.0、ストローク 73.86</text>
<text x="70" y="881" fill="#222" text-anchor="start" font-size="13">保持具：支持板 r=0.7 は t下≦2.86 までΔが増えない。支持板の後端が 0.407·t下 だけ後ろに出る分、収納d1の下限が上がる</text>
<text x="70" y="901" fill="#222" text-anchor="start" font-size="13">参考：収納時だけ水平に戻す案（K018のA）なら、Δ=0 のまま t下+a′≦6</text>
