<text x="58.92" y="1462.86" text-anchor="start" fill="#C0392B">台詞でこの統合が崩れる限界を直接測った研究では、音楽の訓練あり 9°、訓練なし 19°</text>
<text x="58.92" y="1490.52" text-anchor="start" fill="#C0392B">（Komiyama 1989、Stenzel et al. 2017a。PMC6538976 の表1による）。控えめな 9° を許容値とし、9〜19° は依頼主判断。</text>
