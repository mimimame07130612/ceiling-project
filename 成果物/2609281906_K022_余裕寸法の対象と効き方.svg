<text x="60" y="740" fill="#222" text-anchor="start" font-size="14" font-weight="bold">■ 余裕寸法の対象と、余裕 m を取ったときの変化（計算）</text>
<text x="60" y="768" fill="#222" text-anchor="start" font-size="13" font-weight="bold">ID</text>
<text x="100" y="768" fill="#222" text-anchor="start" font-size="13" font-weight="bold">対象（どこ と どこ の間）</text>
<text x="430" y="768" fill="#222" text-anchor="start" font-size="13" font-weight="bold">今の値</text>
<text x="580" y="768" fill="#222" text-anchor="start" font-size="13" font-weight="bold">余裕 m を取ると変わること</text>
<text x="1380" y="768" fill="#222" text-anchor="start" font-size="13" font-weight="bold">今の制約</text>
<text x="60" y="790" fill="#C8307A" text-anchor="start" font-size="13">c1</text>
<text x="100" y="790" fill="#222" text-anchor="start" font-size="13">収納時：CSP最上点P2 ↔ 掘込面 h=270</text>
<text x="430" y="790" fill="#222" text-anchor="start" font-size="13">0.77</text>
<text x="580" y="790" fill="#222" text-anchor="start" font-size="13">m≦0.77：支持板の上限 t下（r=0.7）＝3.70 − 1.094·m。m＞0.77：CSP単体でも入らず、h=245 を (m−0.77) 以上下げる（K018）</text>
<text x="1380" y="790" fill="#222" text-anchor="start" font-size="13">拘束</text>
<text x="60" y="812" fill="#C8307A" text-anchor="start" font-size="13">c2</text>
<text x="100" y="812" fill="#222" text-anchor="start" font-size="13">収納時：CSP背面P0 ↔ 掘込み前壁 d=45.5</text>
<text x="430" y="812" fill="#222" text-anchor="start" font-size="13">0.70（d1=46.2）</text>
<text x="580" y="812" fill="#222" text-anchor="start" font-size="13">収納d1の下限が上がる。ワンモーション移動の条件（K013）を再計算</text>
<text x="1380" y="812" fill="#222" text-anchor="start" font-size="13">拘束</text>
<text x="60" y="834" fill="#C8307A" text-anchor="start" font-size="13">c3</text>
<text x="100" y="834" fill="#222" text-anchor="start" font-size="13">収納時：CSP右側面 ↔ 梁2内面 x=170</text>
<text x="430" y="834" fill="#222" text-anchor="start" font-size="13">0</text>
<text x="580" y="834" fill="#222" text-anchor="start" font-size="13">中心x＝141.45 − m、LP中央とのずれ＝27.55 + m</text>
<text x="1380" y="834" fill="#222" text-anchor="start" font-size="13">拘束</text>
<text x="60" y="856" fill="#C8307A" text-anchor="start" font-size="13">c4</text>
<text x="100" y="856" fill="#222" text-anchor="start" font-size="13">使用時：CSP最下点P1 ↔ 光束上端面</text>
<text x="430" y="856" fill="#222" text-anchor="start" font-size="13">0</text>
<text x="580" y="856" fill="#222" text-anchor="start" font-size="13">使用時の最下点 h=166.5 + m、ストローク 78.5 − m、LP目への仰角 +0.24°/cm</text>
<text x="1380" y="856" fill="#222" text-anchor="start" font-size="13">拘束</text>
<text x="60" y="878" fill="#C8307A" text-anchor="start" font-size="13">c5</text>
<text x="100" y="878" fill="#222" text-anchor="start" font-size="13">収納時：CSP前面側 ↔ 配光118°境界</text>
<text x="430" y="878" fill="#222" text-anchor="start" font-size="13">16.9（h=245）</text>
<text x="580" y="878" fill="#222" text-anchor="start" font-size="13">収納d1の上限 56.2 − m（今は余裕が大きい）</text>
<text x="1380" y="878" fill="#222" text-anchor="start" font-size="13">拘束なし</text>
<text x="60" y="900" fill="#C8307A" text-anchor="start" font-size="13">c6</text>
<text x="100" y="900" fill="#222" text-anchor="start" font-size="13">使用時：CSP背面 ↔ SC幕面</text>
<text x="430" y="900" fill="#222" text-anchor="start" font-size="13">8（A02-004）</text>
<text x="580" y="900" fill="#222" text-anchor="start" font-size="13">すでに余裕として設定済み（d1≧33）</text>
<text x="1380" y="900" fill="#222" text-anchor="start" font-size="13">設定済み</text>
<text x="60" y="922" fill="#C8307A" text-anchor="start" font-size="13">c7</text>
<text x="100" y="922" fill="#222" text-anchor="start" font-size="13">動作中：CSP ↔ SCケース</text>
<text x="430" y="922" fill="#222" text-anchor="start" font-size="13">—</text>
<text x="580" y="922" fill="#222" text-anchor="start" font-size="13">経路で決まる（STEP4で確認、K011の注意）</text>
<text x="1380" y="922" fill="#222" text-anchor="start" font-size="13">STEP4</text>
<text x="60" y="954" fill="#444" text-anchor="start" font-size="13">左側（梁1内面まで23.4）・照明の横方向は、右限・振りなしの配置では拘束にならない（K019〜K021）</text>
<text x="60" y="974" fill="#444" text-anchor="start" font-size="13">余裕 m の値は依頼主が決める。値はc1〜c4で別々にしてよい</text>
