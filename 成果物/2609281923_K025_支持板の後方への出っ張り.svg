<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="828" viewBox="0 0 1100 828" font-family="Noto Sans CJK JP, Hiragino Sans, Meiryo, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="40" fill="#222" text-anchor="start" font-size="18" font-weight="bold">K025　支持板の後方への出っ張り（STEP2 2-2 説明図）</text>
<text x="40" y="62" fill="#222" text-anchor="start" font-size="12">作成 2609281923　側面図（左がSC側、右がLP側）。CSP基準の相対座標（P0原点）。単位cm。支持板は t下=2.86、r=0.7（K024の上限）で図示</text>
<text x="80" y="100" fill="#222" text-anchor="start" font-size="15" font-weight="bold">① 全体（使用位置の近く）</text>
<polyline points="116.92,526 116.92,110" fill="none" fill-opacity="1" stroke="#333333" stroke-width="3"/>
<text x="110.92" y="136" fill="#222" text-anchor="end" font-size="14">SC幕面</text>
<polygon points="236,370 490.15,483.15 580.04,281.26 325.89,168.11" fill="#eeeeee" fill-opacity="1" stroke="#333333" stroke-width="1.4"/>
<polyline points="490.15,483.15 580.04,281.26" fill="none" fill-opacity="1" stroke="#C0392B" stroke-width="4"/>
<polygon points="236,370 413.9,449.21 398.78,483.17 220.88,403.97" fill="#2E9E6B" fill-opacity="0.35" stroke="#2E9E6B" stroke-width="1.6"/>
<polyline points="325.89,168.11 210.3,427.72" fill="none" fill-opacity="1" stroke="#2C6FB0" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="204.3" y="441.72" fill="#2C6FB0" text-anchor="end" font-size="12">背面をそのまま下に延ばした線</text>
<circle cx="236" cy="370" r="4.5" fill="#333333"/>
<text x="246" y="374" fill="#222" text-anchor="start" font-size="13">P0（背面の最後端）</text>
<circle cx="220.88" cy="403.97" r="4.5" fill="#C8307A"/>
<text x="230.88" y="419.97" fill="#C8307A" text-anchor="start" font-size="13">支持板の後端</text>
<text x="408.02" y="325.63" fill="#222" text-anchor="middle" font-size="14">CSP（24°）</text>
<text x="317.39" y="430.59" fill="#2E9E6B" text-anchor="middle" font-size="13">支持板</text>
<polygon points="194.4,424.6 264.6,424.6 264.6,349.2 194.4,349.2" fill="none" fill-opacity="1" stroke="#D35400" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="268.6" y="345.2" fill="#D35400" text-anchor="start" font-size="12">②で拡大</text>
<text x="620" y="100" fill="#222" text-anchor="start" font-size="15" font-weight="bold">② P0まわりの拡大</text>
<polygon points="843.2,266.4 1047.1,357.18 1097.54,243.9 893.64,153.12" fill="#eeeeee" fill-opacity="1" stroke="#333333" stroke-width="1.6"/>
<polygon points="843.2,266.4 1047.1,357.18 974.98,519.17 771.08,428.39" fill="#2E9E6B" fill-opacity="0.3" stroke="#2E9E6B" stroke-width="1.6"/>
<polyline points="893.64,153.12 755.95,462.37" fill="none" fill-opacity="1" stroke="#2C6FB0" stroke-width="1.4" stroke-dasharray="5 3"/>
<polyline points="843.2,266.4 843.2,428.39" fill="none" fill-opacity="1" stroke="#8a857a" stroke-width="1.2" stroke-dasharray="2 3"/>
<polyline points="771.08,428.39 843.2,428.39" fill="none" fill-opacity="1" stroke="#C8307A" stroke-width="3"/>
<polyline points="843.2,266.4 771.08,428.39" fill="none" fill-opacity="1" stroke="#333333" stroke-width="2.5"/>
<circle cx="843.2" cy="266.4" r="4.5" fill="#333333"/>
<circle cx="771.08" cy="428.39" r="4.5" fill="#C8307A"/>
<text x="853.2" y="260.4" fill="#222" text-anchor="start" font-size="15" font-weight="bold">P0</text>
<text x="759.08" y="420.39" fill="#C8307A" text-anchor="end" font-size="15">支持板の後端</text>
<text x="793.14" y="347.39" fill="#222" text-anchor="end" font-size="14">支持板の厚さ t下</text>
<text x="793.14" y="367.39" fill="#444" text-anchor="end" font-size="12">（底面に直角＝24°傾いている）</text>
<text x="807.14" y="462.39" fill="#C8307A" text-anchor="middle" font-size="15" font-weight="bold">t下·sin24° ＝ 1.16</text>
<text x="807.14" y="482.39" fill="#C8307A" text-anchor="middle" font-size="13">（SC側へ出る量）</text>
<text x="853.2" y="347.39" fill="#8a857a" text-anchor="start" font-size="13">t下·cos24° ＝ 2.61（下へ出る量）</text>
<text x="970.37" y="255.15" fill="#222" text-anchor="middle" font-size="14">CSP</text>
<text x="931.75" y="402.87" fill="#2E9E6B" text-anchor="middle" font-size="14">支持板</text>
<text x="80" y="610" fill="#222" text-anchor="start" font-size="14" font-weight="bold">■ なぜSC側に出るのか</text>
<text x="80" y="632" fill="#222" text-anchor="start" font-size="14">　・CSPはLP側を下げて24°傾いているので、背面（SC側の面）は真上ではなく、上がLP側に倒れている</text>
<text x="80" y="654" fill="#222" text-anchor="start" font-size="14">　・支持板は底面にぴったり付くので、厚さの向きは底面に直角＝背面と同じ向き（24°傾いた向き）になる</text>
<text x="80" y="676" fill="#222" text-anchor="start" font-size="14">　・支持板の後端を背面にそろえると、後端は「背面をそのまま下に延ばした線」の上に来る</text>
<text x="80" y="698" fill="#222" text-anchor="start" font-size="14">　・この線は下に行くほどSC側に寄っているので、厚さ t下 の分だけ下がった後端は、P0よりSC側に出る</text>
<text x="80" y="720" fill="#222" text-anchor="start" font-size="14">　　出る量 ＝ t下·sin24° ＝ 0.407·t下（t下=2.86 なら 1.16）</text>
<text x="80" y="742" fill="#222" text-anchor="start" font-size="14" font-weight="bold">■ 何に効くのか</text>
<text x="80" y="764" fill="#222" text-anchor="start" font-size="14">　・使用位置で、SC幕面に一番近い点がP0ではなく支持板の後端になる</text>
<text x="80" y="786" fill="#222" text-anchor="start" font-size="14">　・SC幕面とのすき間8（A02-004）を守るには、使用d1を 0.407·t下 だけLP側へ出す必要がある（K024）</text>
</svg>