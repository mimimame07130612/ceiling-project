<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="608" viewBox="0 0 1300 608" font-family="Noto Sans CJK JP, Hiragino Sans, Meiryo, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="40" fill="#222" text-anchor="start" font-size="18" font-weight="bold">K035　荷重の組み合わせと安全率の参考値（STEP3 3-6）</text>
<text x="40" y="62" fill="#222" text-anchor="start" font-size="12">作成 2609290127　W＝CSP＋保持具・リンク（mh）の重さ。D04-003により、片側のリンク・取付部はこの全荷重を1系統で持つ。mhは未定のため0kgと5kgで例示</text>
<text x="40" y="100" fill="#222" text-anchor="start" font-size="14" font-weight="bold">■ 荷重ケース</text>
<text x="40" y="126" fill="#222" text-anchor="start" font-size="12" font-weight="bold">ケース</text>
<text x="250" y="126" fill="#222" text-anchor="start" font-size="12" font-weight="bold">中身</text>
<text x="560" y="126" fill="#222" text-anchor="start" font-size="12" font-weight="bold">鉛直（N）mh=0 / 5kg</text>
<text x="740" y="126" fill="#222" text-anchor="start" font-size="12" font-weight="bold">水平（N）mh=0 / 5kg</text>
<text x="920" y="126" fill="#222" text-anchor="start" font-size="12" font-weight="bold">根拠</text>
<text x="40" y="150" fill="#222" text-anchor="start" font-size="12">LC1 常時</text>
<text x="250" y="150" fill="#222" text-anchor="start" font-size="12">W</text>
<text x="560" y="150" fill="#222" text-anchor="start" font-size="12">77.5 / 126.5</text>
<text x="740" y="150" fill="#222" text-anchor="start" font-size="12">—</text>
<text x="920" y="150" fill="#222" text-anchor="start" font-size="12">A01-001</text>
<text x="40" y="174" fill="#C0392B" text-anchor="start" font-size="12">LC2 猫が飛び乗る</text>
<text x="250" y="174" fill="#C0392B" text-anchor="start" font-size="12">W＋猫×衝撃係数2</text>
<text x="560" y="174" fill="#C0392B" text-anchor="start" font-size="12">175.6 / 224.6</text>
<text x="740" y="174" fill="#C0392B" text-anchor="start" font-size="12">—</text>
<text x="920" y="174" fill="#C0392B" text-anchor="start" font-size="12">A04-001。係数2は落下高さ0の値</text>
<text x="40" y="198" fill="#222" text-anchor="start" font-size="12">LC3 地震（クラスB）</text>
<text x="250" y="198" fill="#222" text-anchor="start" font-size="12">W×(1＋KV)、W×KH　KH=1.0</text>
<text x="560" y="198" fill="#222" text-anchor="start" font-size="12">116.2 / 189.8</text>
<text x="740" y="198" fill="#222" text-anchor="start" font-size="12">77.5 / 126.5</text>
<text x="920" y="198" fill="#222" text-anchor="start" font-size="12">設備耐震指針 上層階 Z=1.0</text>
<text x="40" y="222" fill="#222" text-anchor="start" font-size="12">LC3 地震（クラスA）</text>
<text x="250" y="222" fill="#222" text-anchor="start" font-size="12">W×(1＋KV)、W×KH　KH=1.5</text>
<text x="560" y="222" fill="#222" text-anchor="start" font-size="12">135.6 / 221.5</text>
<text x="740" y="222" fill="#222" text-anchor="start" font-size="12">116.2 / 189.8</text>
<text x="920" y="222" fill="#222" text-anchor="start" font-size="12">設備耐震指針 上層階 Z=1.0</text>
<text x="40" y="246" fill="#222" text-anchor="start" font-size="12">LC3 地震（クラスS）</text>
<text x="250" y="246" fill="#222" text-anchor="start" font-size="12">W×(1＋KV)、W×KH　KH=2.0</text>
<text x="560" y="246" fill="#222" text-anchor="start" font-size="12">155.0 / 253.1</text>
<text x="740" y="246" fill="#222" text-anchor="start" font-size="12">155.0 / 253.1</text>
<text x="920" y="246" fill="#222" text-anchor="start" font-size="12">設備耐震指針 上層階 Z=1.0</text>
<text x="40" y="290" fill="#222" text-anchor="start" font-size="12">・LC2の衝撃係数2は「高さ0から急に乗った」ときの値。実際に跳び乗ると、乗る高さと受ける側のたわみで大きくなる（上限は資料なし）</text>
<text x="40" y="310" fill="#222" text-anchor="start" font-size="12">・LC3の震度は建築設備の指針の上層階の値（Z＝地域係数は最大1.0として計算）。この装置が上層階・中間階・1階のどれに当たるかは未確認。猫と地震は同時に考えない</text>
<text x="40" y="360" fill="#222" text-anchor="start" font-size="14" font-weight="bold">■ 必要な強さ（最大の荷重×安全率）の例：mh=0 / 5kg</text>
<text x="40" y="386" fill="#222" text-anchor="start" font-size="12" font-weight="bold">安全率</text>
<text x="330" y="386" fill="#222" text-anchor="start" font-size="12" font-weight="bold">必要な強さ（鉛直・N）</text>
<text x="560" y="386" fill="#222" text-anchor="start" font-size="12" font-weight="bold">参考</text>
<text x="40" y="410" fill="#222" text-anchor="start" font-size="12">4</text>
<text x="330" y="410" fill="#222" text-anchor="start" font-size="12">702 / 1012</text>
<text x="560" y="410" fill="#222" text-anchor="start" font-size="12">つりチェーンの安全係数（クレーン則 第213条の2、条件あり）</text>
<text x="40" y="434" fill="#222" text-anchor="start" font-size="12">6</text>
<text x="330" y="434" fill="#222" text-anchor="start" font-size="12">1054 / 1519</text>
<text x="560" y="434" fill="#222" text-anchor="start" font-size="12">玉掛け用ワイヤロープの安全係数（クレーン則 第213条）</text>
<text x="40" y="478" fill="#222" text-anchor="start" font-size="14" font-weight="bold">■ 気づいたこと</text>
<text x="40" y="504" fill="#222" text-anchor="start" font-size="12">・最大の鉛直荷重は猫（LC2）と地震クラスS（LC3）が同じくらい。mh=0なら猫、mhが重くなるとクラスSの地震のほうが大きくなる</text>
<text x="40" y="524" fill="#222" text-anchor="start" font-size="12">・A04-004（相手にかかる力150N以下）との関係：下降中に下の物に乗る重さは W＝(7.90＋mh)×9.81。150N以下にするには mh≦7.4 kg（動く部分の質量）</text>
<text x="40" y="544" fill="#222" text-anchor="start" font-size="12">・梁へのねじの引き抜き：規準の耐力式はJIS規格のねじを指定の条件で使った場合だけに当てはまり、市販のねじは製品ごとの試験値で確認されているのが現状</text>
<text x="40" y="564" fill="#222" text-anchor="start" font-size="12">　→ ねじは試験値（メーカー公表値）のある製品を選び、その値で確認する（STEP6）。1本抜けても持つ本数にする（D04-003）</text>
</svg>