<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1180" viewBox="0 0 1520 1180" font-family="Noto Sans CJK JP, Hiragino Sans, Meiryo, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E9E6B"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="40" fill="#222" text-anchor="start" font-size="18" font-weight="bold">K015　CSP保持外形の変数（STEP2 2-5）</text>
<text x="40" y="62" fill="#222" text-anchor="start" font-size="12">作成 2609272311　CSP単体・チルト24°（A02-002）。座標はCSP基準の相対値（P0＝SC側下角を原点）。単位cm</text>
<line x1="40" y1="92" x2="74" y2="92" stroke="#333333" stroke-width="2.4"/>
<text x="82" y="96" fill="#222" text-anchor="start" font-size="12">CSP外形 W57.1×D21.4×H17.0（A01-001）</text>
<line x1="40" y1="114" x2="74" y2="114" stroke="#C0392B" stroke-width="2.4"/>
<text x="82" y="118" fill="#222" text-anchor="start" font-size="12">前面（バッフル）：保持具で覆えない面</text>
<line x1="40" y1="136" x2="74" y2="136" stroke="#6A5FD0" stroke-width="2.4"/>
<text x="82" y="140" fill="#222" text-anchor="start" font-size="12">背面の端子（ケーブル接続が必要）</text>
<line x1="40" y1="158" x2="74" y2="158" stroke="#2E9E6B" stroke-width="2.4" stroke-dasharray="6 3"/>
<text x="82" y="162" fill="#222" text-anchor="start" font-size="12">(保持外形：各方向に t を足した外形。線の位置は模式、t=3で図示)</text>
<text x="40" y="196" fill="#222" text-anchor="start" font-size="13" font-weight="bold">■ 変数（保持具がCSP外形に足す量）</text>
<text x="50" y="216" fill="#222" text-anchor="start" font-size="12">t上：上面の外側　　t下：底面の外側　　t前：前面の外側　　t後：背面の外側</text>
<text x="50" y="234" fill="#222" text-anchor="start" font-size="12">t左・t右：左右側面の外側（LPから見た左右）</text>
<text x="50" y="252" fill="#222" text-anchor="start" font-size="12">※ 上下前後はCSPの面に対する向き（24°傾いた向き）で定義</text>
<text x="40" y="286" fill="#222" text-anchor="start" font-size="13" font-weight="bold">■ 面ごとの事実</text>
<text x="50" y="306" fill="#222" text-anchor="start" font-size="12">前面：ウーファー2・ツイーター1・バスレフポート2（両端）。音の出口が端まである（写真・取説）</text>
<text x="50" y="324" fill="#222" text-anchor="start" font-size="12">背面：端子1か所（中央付近）（写真）</text>
<text x="50" y="342" fill="#222" text-anchor="start" font-size="12">底面：ねじ穴なし、ゴム足のみ（依頼主情報。資料では未確認）</text>
<text x="50" y="360" fill="#222" text-anchor="start" font-size="12">上面：資料なし（写真に写っていない）</text>
<text x="50" y="378" fill="#222" text-anchor="start" font-size="12">側面：写真では付属物なし</text>
<text x="50" y="396" fill="#222" text-anchor="start" font-size="12">本体加工不可（D01-010）、取付手段なし（D01-011）</text>
<text x="50" y="414" fill="#444" text-anchor="start" font-size="12">※ ドライバ・ポート・端子の位置は写真からの目安（寸法未確認）</text>
<text x="40" y="448" fill="#222" text-anchor="start" font-size="13" font-weight="bold">■ 保持外形が満たす式（余裕寸法0、計算）</text>
<text x="50" y="468" fill="#222" text-anchor="start" font-size="12">① 収納時の高さ（チルト24°維持）：0.407(t前+t後) + 0.914(t上+t下) ≦ 0.77</text>
<text x="50" y="486" fill="#444" text-anchor="start" font-size="12">　　［掘込面h=270 − 下限h=245 − 外接高さ24.23］</text>
<text x="50" y="504" fill="#444" text-anchor="start" font-size="12">　　参考：収納時だけ水平に戻す場合（A02-003で変更可）：t上+t下 ≦ 8.0</text>
<text x="50" y="522" fill="#222" text-anchor="start" font-size="12">② 収納時の奥行（収納帯d=45.5〜82.7）：0.914(t前+t後) + 0.407(t上+t下) ≦ 10.74</text>
<text x="50" y="540" fill="#444" text-anchor="start" font-size="12">　　［ワンモーション移動の条件（d1≧46.2、K013）は外形が変わると再計算が必要］</text>
<text x="50" y="558" fill="#222" text-anchor="start" font-size="12">③ 左右（設置エリア幅80.5）：t左 + t右 ≦ 23.4　［x位置は2-1で決定］</text>
<text x="50" y="576" fill="#444" text-anchor="start" font-size="12">※ 機構本体の収納空間はこの外形とは別に必要（A00-001は機構も含む。STEP4）</text>
<text x="720" y="90" fill="#222" text-anchor="start" font-size="14" font-weight="bold">平面図（−h方向に見下ろす。上がSC側、下がLP側）</text>
