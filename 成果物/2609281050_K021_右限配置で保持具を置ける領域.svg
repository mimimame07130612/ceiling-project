<text x="262.8" y="624" fill="#2E9E6B" text-anchor="middle" font-size="11">(t左はここまで)</text>
<text x="823.8" y="682.5" fill="#2E9E6B" text-anchor="middle" font-size="13">梁2の下</text>
<text x="823.8" y="702" fill="#2E9E6B" text-anchor="middle" font-size="11">(t右を出せる)</text>
<text x="524.4" y="598" fill="#222" text-anchor="middle" font-size="13">CSP（中心x=141.45）</text>
<text x="706" y="627.2" fill="#C0392B" text-anchor="end" font-size="11">右側面＝梁2内面 x=170（t右＝0）</text>
<text x="1170" y="120" fill="#222" text-anchor="start" font-size="14" font-weight="bold">■ 図からわかること</text>
<text x="1170" y="146" fill="#222" text-anchor="start" font-size="13">【左右】右限に置くと、梁下面h=254.5より上では</text>
<text x="1170" y="166" fill="#333" text-anchor="start" font-size="13">　右側面が梁2内面に接する → そこでは t右＝0</text>
<text x="1170" y="186" fill="#333" text-anchor="start" font-size="13">　梁下面より下は梁がないので、右側に出せる</text>
<text x="1170" y="206" fill="#333" text-anchor="start" font-size="13">　（CSP右側面の下部：オレンジ部分）</text>
<text x="1170" y="226" fill="#333" text-anchor="start" font-size="13">　左側は梁1内面まで 23.4 の空き</text>
<text x="1170" y="246" fill="#222" text-anchor="start" font-size="13">【上下前後（側面図の緑の空間）】</text>
<text x="1170" y="266" fill="#333" text-anchor="start" font-size="13">　収納時に使える空間＝ h=245〜270、d=45.5〜照明境界</text>
<text x="1170" y="286" fill="#333" text-anchor="start" font-size="13">　チルトしたCSPの周りに4つの空き（①〜④）がある</text>
<text x="1170" y="306" fill="#333" text-anchor="start" font-size="13">　① 底面側：P0寄りに厚みを取れる（K016）</text>
<text x="1170" y="326" fill="#333" text-anchor="start" font-size="13">　② 前面側：照明境界まで余裕（K017の爪）</text>
<text x="1170" y="346" fill="#333" text-anchor="start" font-size="13">　③ 背面側：P0より上は奥へ広がる。端子あり</text>
<text x="1170" y="366" fill="#333" text-anchor="start" font-size="13">　④ 上面側：P2寄りは0.77、P3寄りは9.47まで</text>
<text x="1170" y="386" fill="#333" text-anchor="start" font-size="13">　全面に均一の厚さを足す（K015）と、</text>
<text x="1170" y="406" fill="#333" text-anchor="start" font-size="13">　P1・P2の角でぶつかる</text>
<text x="1170" y="426" fill="#222" text-anchor="start" font-size="13">【前提】収納d1=46.2（K013）。d1は56.2まで前へ</text>
<text x="1170" y="446" fill="#333" text-anchor="start" font-size="13">　ずらせる（A02-005）→ ③の空きが広がる</text>
<text x="1170" y="466" fill="#333" text-anchor="start" font-size="13">　余裕寸法は0（2-4で設定）</text>
</svg>