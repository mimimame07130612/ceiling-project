<text x="40" y="62" fill="#222" text-anchor="start" font-size="12">作成 2609281050　部屋座標・単位cm。CSP右側面＝梁2内面 x=170（右限、中心x=141.45）、収納 d1=46.2・チルト24°・最下点h=245（K018のB）。保持具の厚さは0で図示</text>
