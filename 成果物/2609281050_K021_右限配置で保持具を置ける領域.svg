<text x="200.3" y="156.4" fill="#222" text-anchor="end" font-size="13">P2</text>
<text x="425.3" y="258.2" fill="#222" text-anchor="start" font-size="13">P3</text>
<text x="202.7" y="401.5" fill="#2E9E6B" text-anchor="middle" font-size="12">①底面側（K016 支持板）</text>
<text x="441.3" y="374" fill="#2E9E6B" text-anchor="start" font-size="12">②前面側（K017 爪）</text>
<text x="258" y="192.5" fill="#2E9E6B" text-anchor="start" font-size="12">④上面側</text>
<text x="123.8" y="242" fill="#2E9E6B" text-anchor="start" font-size="12">③背面側</text>
<text x="137" y="302.5" fill="#6A5FD0" text-anchor="start" font-size="11">端子</text>
<text x="301.7" y="359.7" fill="#D35400" text-anchor="middle" font-size="11">CSP右側面のうち梁下面より下</text>
<text x="60" y="510" fill="#222" text-anchor="start" font-size="14" font-weight="bold">正面図（LP側から−d方向を見る）　収納時</text>
