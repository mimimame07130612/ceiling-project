<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="750" viewBox="0 0 1020 750" font-family="Noto Sans CJK JP, Hiragino Sans, Meiryo, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
