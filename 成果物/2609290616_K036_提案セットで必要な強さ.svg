<text x="40" y="40" fill="#222" text-anchor="start" font-size="18" font-weight="bold">K036　提案セットで必要になる強さ（STEP3 3-6）</text>
<text x="40" y="62" fill="#222" text-anchor="start" font-size="12">作成 2609290616　動く部分の重さ W＝(CSP 7.90kg＋保持具・リンク 7.4kg)×9.81＝150 N（mhは上限で計算）</text>
<text x="40" y="80" fill="#222" text-anchor="start" font-size="12">最大の荷重：鉛直 300 N（30.6 kgf）・水平 300 N（30.6 kgf）＝地震クラスS（猫LC2は鉛直 248 N）</text>
