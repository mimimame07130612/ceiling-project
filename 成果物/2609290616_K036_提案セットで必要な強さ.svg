<text x="40" y="530" fill="#222" text-anchor="start" font-size="14" font-weight="bold">■ ねじ1本あたりに必要な強さ（取付部1か所の鉛直、1本抜けた残りで持つ場合の単純な割り算）</text>
<text x="60" y="558" fill="#222" text-anchor="start" font-size="12">ねじ2本 → 残り1本で 1200 N → 1本あたり 1200 N（122 kgf）</text>
<text x="60" y="580" fill="#222" text-anchor="start" font-size="12">ねじ3本 → 残り2本で 1200 N → 1本あたり 600 N（61 kgf）</text>
<text x="60" y="602" fill="#222" text-anchor="start" font-size="12">ねじ4本 → 残り3本で 1200 N → 1本あたり 400 N（41 kgf）</text>
<text x="60" y="630" fill="#8a857a" text-anchor="start" font-size="12">※実際にはねじの位置と力の向き（引き抜き／せん断）で1本ごとの負担が変わる。STEP4・STEP6で取付部の形が決まってから確かめる</text>
<text x="40" y="670" fill="#222" text-anchor="start" font-size="14" font-weight="bold">■ 身近なものとの比べ</text>
<text x="60" y="696" fill="#222" text-anchor="start" font-size="12">・取付部とリンクは、片側だけで体重60kgの大人2人ぶん（約122 kgf）がぶら下がっても壊れない強さが目安</text>
<text x="60" y="718" fill="#222" text-anchor="start" font-size="12">・保持具は、体重60kgの大人3人ぶん（約183 kgf）がぶら下がっても壊れない強さが目安</text>
</svg>