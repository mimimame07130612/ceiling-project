<text x="1130" y="520" fill="#222" text-anchor="start" font-size="14" font-weight="bold">■ 現在の前提（STEP2結論）</text>
<text x="1130" y="546" fill="#222" text-anchor="start" font-size="13">・CSP右側面 x=168、梁2内面 x=170 → 間は c3=2（仮の余裕）</text>
<text x="1130" y="568" fill="#222" text-anchor="start" font-size="13">・右側面のうち梁と重なる高さ：h=254.5〜268（13.5）</text>
<text x="1130" y="590" fill="#222" text-anchor="start" font-size="13">　この範囲は右側に保持具を出さない（A03-002）</text>
<text x="1130" y="612" fill="#222" text-anchor="start" font-size="13">・梁下面より下：h=243.77〜254.5（10.73）は右側に出せる</text>
<text x="1130" y="634" fill="#222" text-anchor="start" font-size="13">・右側面の面積のうち梁と重なる割合：59%</text>
<text x="1130" y="656" fill="#222" text-anchor="start" font-size="13">・「密着」ではなく間2だが、その間2は余裕寸法で</text>
<text x="1130" y="678" fill="#222" text-anchor="start" font-size="13">　保持具には使えない</text>
